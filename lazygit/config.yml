# Mirrors the gc() gitmoji helper from zsh/.zshrc: lazygit shells out to git and
# never sees shell functions, so the convention is restated here.
customCommands:
  - key: "C"
    context: "files"
    description: "Commit (gitmoji)"
    prompts:
      - type: "menu"
        key: "Type"
        title: "Type"
        options:
          - { name: "✨ feat", value: "✨ feat" }
          - { name: "🐛 fix", value: "🐛 fix" }
          - { name: "🔧 config", value: "🔧 config" }
          - { name: "📝 docs", value: "📝 docs" }
          - { name: "♻️ refactor", value: "♻️ refactor" }
          - { name: "💄 style", value: "💄 style" }
          - { name: "✅ test", value: "✅ test" }
          - { name: "🚀 chore", value: "🚀 chore" }
      - type: "input"
        key: "Message"
        title: "Message"
    command: 'git commit -m {{ printf "%s: %s" .Form.Type .Form.Message | quote }}'
    loadingText: "committing"

services:
  github-perso: github:github.com

git:
  pagers:
    - pager: delta --dark --paging=never

gui:
  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    searchingActiveBorderColor:
      - "#7aa2f7"
      - bold
    selectedLineBgColor:
      - "#283457"
    inactiveViewSelectedLineBgColor:
      - "#292e42"
